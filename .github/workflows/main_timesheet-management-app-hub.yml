# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - timesheet-management-app-hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Build each project separately
      - name: 🏗️ Build Auth Service
        run: dotnet publish "./Auth Service/Auth Service.csproj" -c Release -o ./publish/AuthService

      - name: 🏗️ Build Doctor & Staff Service
        run: dotnet publish "./Doctor & Staff Service/Doctor & Staff Service.csproj" -c Release -o "./publish/DoctorService"

      - name: 🏗️ Build Medical Records Service
        run: dotnet publish "./Medical Records Service/Medical Records Service.csproj" -c Release -o "./publish/RecordsService"

      - name: 🏗️ Build Operations Service
        run: dotnet publish "./Operations Service/Operations Service.csproj" -c Release -o "./publish/OperationsService"

      - name: 🏗️ Build Patient Service
        run: dotnet publish "./Patient Service/Patient Service.csproj" -c Release -o "./publish/PatientService"

      - name: 🏗️ Build API Gateway
        run: dotnet publish "./ApiGateway/ApiGateway.csproj" -c Release -o ./publish/ApiGateway

      # Upload artifacts for deployment
      - name: 📤 Upload Gateway artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-app
          path: ./publish/ApiGateway

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Download Gateway artifact
        uses: actions/download-artifact@v4
        with:
          name: gateway-app
          path: ./publish/ApiGateway

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Deploy Gateway to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'timesheet-management-app-hub'
          slot-name: 'Production'
          package: ./publish/ApiGateway
